<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Lolly's Food Joint</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="fade-in">
    <nav class="navbar">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div class="logo">
                <img src="Images/lollys logo.jpg" alt="Lolly's Logo">
                <h1>Lolly's Food Joint</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a></li>
            </ul>
            <div class="burger">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <section class="container" style="padding: 220px 0 100px; display: flex; justify-content: center;">
        <div class="glass-panel" style="width: 100%; max-width: 580px; padding: 64px;">
            <div style="text-align: center; margin-bottom: 48px;">
                <span style="color: var(--accent-orange); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; display: block; margin-bottom: 12px;">New Account</span>
                <h2 style="font-size: 2.5rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px;">Join the <span style="color: var(--accent-orange);">Family</span></h2>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Experience Durban's finest flavors with exclusive perks.</p>
            </div>
            
            <form id="register-form">
                <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="reg-first" required placeholder="John">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="reg-last" required placeholder="Doe">
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="reg-phone" required placeholder="e.g. 083 353 2775">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" required placeholder="••••••••">
                </div>
                
                <!-- Simple Math Captcha -->
                <div id="captcha-container" style="margin-bottom: 32px; background: #F8FAFC; padding: 24px; border-radius: 20px; border: 1px solid #E2E8F0;">
                    <label id="captcha-label" style="display: block; margin-bottom: 12px; font-weight: 700; color: var(--text-dark);">Human Verification: <span id="math-problem" style="color: var(--accent-orange);"></span></label>
                    <input type="number" id="captcha-answer" required placeholder="Enter answer" style="background: white;">
                </div>
                
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 32px; display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-shield-alt" style="color: var(--success);"></i> Your data is protected by enterprise-grade security.
                </p>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 18px;">Create My Account <i class="fas fa-arrow-right" style="margin-left: 8px;"></i></button>
            </form>
            
            <div style="margin-top: 40px; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
                Already have an account? <a href="login.html" style="color: var(--accent-orange); font-weight: 800;">Sign In</a>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script>
        let captchaResult;
        function generateCaptcha() {
            const n1 = Math.floor(Math.random() * 10);
            const n2 = Math.floor(Math.random() * 10);
            captchaResult = n1 + n2;
            document.getElementById('math-problem').textContent = `${n1} + ${n2} = ?`;
        }
        generateCaptcha();

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const answer = parseInt(document.getElementById('captcha-answer').value);
            if (answer !== captchaResult) {
                alert('Captcha failed. Please try again.');
                generateCaptcha();
                return;
            }

            const firstName = document.getElementById('reg-first').value;
            const lastName = document.getElementById('reg-last').value;
            const email = document.getElementById('reg-email').value;
            const phone = document.getElementById('reg-phone').value;
            const password = document.getElementById('reg-password').value;

            try {
                const response = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ firstName, lastName, email, phone, password })
                });
                const data = await response.json();

                if (response.ok) {
                    sessionStorage.setItem('verify_email', email);
                    window.location.href = 'verify.html';
                } else {
                    alert(data.error || 'Registration failed');
                }
            } catch (err) {
                alert('Network error. Check if backend is running.');
            }
        });
    </script>
</body>
</html>
